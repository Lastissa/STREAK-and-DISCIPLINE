
<style>
  .sdcel-overlay{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
    pointer-events:none;perspective:1000px}
  .sdcel-card{
    background:linear-gradient(160deg,var(--surface,#161f30),var(--surface2,#1e293b));
    border:1px solid rgba(255,255,255,0.12);border-radius:20px;padding:2rem 2.4rem;text-align:center;
    box-shadow:0 30px 80px rgba(0,0,0,0.45);
    transform:rotateX(20deg) scale(.7) translateZ(-40px);opacity:0;
    transition:transform .5s cubic-bezier(.2,.9,.25,1.3),opacity .4s ease;
    max-width:340px;
  }
  .sdcel-overlay.is-active .sdcel-card{transform:rotateX(0deg) scale(1) translateZ(0);opacity:1}
  .sdcel-icon{font-size:2.6rem;margin-bottom:.6rem;display:inline-block;
    animation:sdcel-bounce 1.1s ease-in-out infinite}
  .sdcel-icon.is-100{font-size:3.2rem}
  @keyframes sdcel-bounce{0%,100%{transform:translateY(0) rotateZ(0)}50%{transform:translateY(-10px) rotateZ(-6deg)}}
  .sdcel-title{font-size:1.15rem;font-weight:800;color:#fff;margin-bottom:.35rem}
  .sdcel-sub{font-size:.82rem;color:#cbd5e1}
  .sdcel-confetti{position:absolute;top:-10px;width:8px;height:14px;opacity:.9;
    animation:sdcel-fall linear forwards}
  @keyframes sdcel-fall{
    0%{transform:translateY(0) rotate(0deg);opacity:1}
    100%{transform:translateY(110vh) rotate(540deg);opacity:0}
  }
</style>

<div class="sdcel-overlay" id="sdcelOverlay" aria-live="polite"></div>

<script>
(function(){
  'use strict';
  var COLORS = ['#3b82f6','#f59e0b','#10b981','#ef4444','#a855f7','#ec4899'];

  function spawnConfetti(root, count){
    for (var i=0;i<count;i++){
      var el = document.createElement('div');
      el.className = 'sdcel-confetti';
      el.style.left = (Math.random()*100) + '%';
      el.style.background = COLORS[Math.floor(Math.random()*COLORS.length)];
      el.style.animationDuration = (1.6 + Math.random()*1.4) + 's';
      el.style.animationDelay = (Math.random()*0.4) + 's';
      root.appendChild(el);
      (function(node){ setTimeout(function(){ node.remove(); }, 3200); })(el);
    }
  }

  function fire(level, label){
    var overlay = document.getElementById('sdcelOverlay');
    if (!overlay) return;
    overlay.innerHTML = '';
    overlay.classList.remove('is-active');

    var is100 = level >= 100;
    var card = document.createElement('div');
    card.className = 'sdcel-card';
    card.innerHTML =
      '<div class="sdcel-icon' + (is100 ? ' is-100' : '') + '">' + (is100 ? '\uD83C\uDFC6' : '\uD83C\uDF89') + '</div>' +
      '<div class="sdcel-title">' + (is100 ? 'Standing ovation!' : 'Halfway hooray!') + '</div>' +
      '<div class="sdcel-sub">' + (label ? ('"' + label + '" ') : '') + (is100 ? 'reached 100% - incredible discipline.' : 'just crossed 50% - keep going!') + '</div>';
    overlay.appendChild(card);
    spawnConfetti(overlay, is100 ? 60 : 28);

    requestAnimationFrame(function(){ overlay.classList.add('is-active'); });

    var dismissAfter = is100 ? 4200 : 3000;
    var dismiss = function(){
      overlay.classList.remove('is-active');
      setTimeout(function(){ overlay.innerHTML = ''; }, 400);
      overlay.removeEventListener('click', dismiss);
    };
    overlay.style.pointerEvents = 'auto';
    overlay.addEventListener('click', dismiss);
    setTimeout(function(){ overlay.style.pointerEvents = 'none'; dismiss(); }, dismissAfter);
  }

  window.SDCelebrate = { fire: fire };
})();
</script>
